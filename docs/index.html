<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0f172a" />
  <title>یار — دستیار هوشمند</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: Vazirmatn, system-ui, sans-serif; box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #0f172a; }
    #app { height: 100%; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; background: #f8fafc; }
    .screen { display: none; flex: 1; flex-direction: column; min-height: 0; }
    .screen.active { display: flex; }
    .tab-on { color: #2563eb; }
    .typing span { animation: blink 1.2s infinite; opacity: .3; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 50% { opacity: 1; } }
  </style>
</head>
<body>
  <div id="app">
    <header class="px-4 py-3 bg-white border-b flex items-center gap-3 shrink-0">
      <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">ی</div>
      <div class="flex-1">
        <div class="font-bold text-slate-800">یار</div>
        <div id="status" class="text-xs text-green-600">آماده</div>
      </div>
      <button onclick="resetChat()" class="text-xs text-slate-400">پاک کردن</button>
    </header>

    <div id="screen-chat" class="screen active">
      <div id="msgs" class="flex-1 overflow-y-auto p-4 space-y-3"></div>
      <div class="px-3 pb-1 flex gap-2 overflow-x-auto shrink-0">
        <button onclick="quick('سلام')" class="shrink-0 text-xs bg-white border rounded-full px-3 py-1.5">سلام</button>
        <button onclick="quick('قبض برق رو چک کن')" class="shrink-0 text-xs bg-white border rounded-full px-3 py-1.5">قبض برق</button>
        <button onclick="quick('برای سفر شیراز ایده بده')" class="shrink-0 text-xs bg-white border rounded-full px-3 py-1.5">سفر</button>
        <button onclick="quick('یک برنامه روزانه بده')" class="shrink-0 text-xs bg-white border rounded-full px-3 py-1.5">برنامه روزانه</button>
      </div>
      <div class="p-3 bg-white border-t flex gap-2 shrink-0" style="padding-bottom: max(12px, env(safe-area-inset-bottom))">
        <input id="inp" class="flex-1 bg-slate-100 rounded-full px-4 py-3 text-sm outline-none" placeholder="پیامت رو بنویس..." onkeydown="if(event.key==='Enter')send()" />
        <button onclick="send()" class="w-11 h-11 rounded-full bg-blue-600 text-white text-lg">➤</button>
      </div>
    </div>

    <div id="screen-tasks" class="screen">
      <div class="p-4 font-bold text-xl border-b bg-white">وظایف</div>
      <div class="p-4 space-y-3 overflow-y-auto">
        <div class="bg-white rounded-2xl p-4 border shadow-sm">قبض برق — منتظر تأیید</div>
        <div class="bg-white rounded-2xl p-4 border shadow-sm">خلاصه گزارش — در حال پردازش</div>
        <div class="bg-white rounded-2xl p-4 border shadow-sm text-slate-500">رزرو بلیط — انجام شد</div>
      </div>
    </div>

    <div id="screen-goals" class="screen">
      <div class="p-4 font-bold text-xl border-b bg-white">اهداف</div>
      <div class="p-4 space-y-3 overflow-y-auto">
        <div class="bg-white rounded-2xl p-4 border"><div class="font-semibold">یادگیری Flutter</div><div class="text-sm text-slate-500 mt-1">۳۵٪</div></div>
        <div class="bg-white rounded-2xl p-4 border"><div class="font-semibold">ورزش منظم</div><div class="text-sm text-slate-500 mt-1">۶۰٪</div></div>
      </div>
    </div>

    <div id="screen-profile" class="screen">
      <div class="p-4 font-bold text-xl border-b bg-white">پروفایل</div>
      <div class="p-8 text-center">
        <div class="w-20 h-20 rounded-full bg-blue-600 text-white text-3xl font-bold flex items-center justify-center mx-auto">ک</div>
        <div class="mt-3 text-xl font-bold">کاربر نمونه</div>
        <div class="text-sm text-slate-500 mt-2">نسخه دمو — بدون نصب</div>
        <p class="text-xs text-slate-400 mt-6 leading-relaxed">این نسخه روی مرورگر گوشی کار می‌کند.<br/>برای AI واقعی، بک‌اند را با کلید API اجرا کن.</p>
      </div>
    </div>

    <nav class="bg-white border-t flex justify-around py-2 text-slate-400 text-xs shrink-0" style="padding-bottom: max(8px, env(safe-area-inset-bottom))">
      <button onclick="go('chat')" id="tab-chat" class="tab-on flex flex-col items-center gap-0.5 py-1"><span class="text-lg">💬</span>چت</button>
      <button onclick="go('tasks')" id="tab-tasks" class="flex flex-col items-center gap-0.5 py-1"><span class="text-lg">✓</span>وظایف</button>
      <button onclick="go('goals')" id="tab-goals" class="flex flex-col items-center gap-0.5 py-1"><span class="text-lg">🏁</span>اهداف</button>
      <button onclick="go('profile')" id="tab-profile" class="flex flex-col items-center gap-0.5 py-1"><span class="text-lg">👤</span>پروفایل</button>
    </nav>
  </div>

  <script>
    let msgs = [{ from: 'yar', text: 'سلام! من یار هستم 👋\nچطور می‌تونم امروز کمکت کنم؟' }];
    let busy = false;

    function replyFor(t) {
      const s = t.toLowerCase();
      if (/سلام|درود|hi|hello/.test(s)) return 'سلام! خوش اومدی. بگو چی می‌خوای انجام بدیم.';
      if (/قبض|برق|آب|گاز/.test(s)) return 'برای قبض:\n۱) مبلغ و مهلت را چک کن\n۲) از اپ بانک یا پرداخت قبض پرداخت کن\nاگر مبلغ را بگی، کمکت می‌کنم برنامه‌ریزی کنی.';
      if (/سفر|بلیط|شیراز|مشهد|شمال/.test(s)) return 'برای سفر پیشنهاد می‌کنم:\n• تاریخ رفت و برگشت را مشخص کن\n• بلیط قطار/هواپیما را زودتر بگیر\n• هتل یا اقامتگاه را مقایسه کن\nکجا و کی می‌خوای بری؟';
      if (/برنامه|روزانه|کار|وظیفه/.test(s)) return 'یک برنامه ساده:\n۰۸:۰۰ بیدارشو و آب بنوش\n۰۹:۰۰ کار عمیق (۹۰ دقیقه)\n۱۲:۳۰ ناهار و استراحت\n۱۶:۰۰ پیگیری کارها\n۲۱:۰۰ جمع‌بندی روز\nکدام بخش را می‌خوای دقیق‌تر کنیم؟';
      if (/ممنون|مرسی|thanks/.test(s)) return 'خواهش می‌کنم 🌟 هر وقت خواستی دوباره پیام بده.';
      return 'متوجه شدم: «' + t + '»\nمی‌تونم برات ایده‌پردازی، برنامه‌ریزی یا تقسیم کار انجام بدم. یک کم بیشتر توضیح بده.';
    }

    function render() {
      const el = document.getElementById('msgs');
      el.innerHTML = msgs.map(m => {
        if (m.typing) return '<div class="flex justify-start"><div class="bg-white border rounded-2xl px-4 py-3 typing"><span>●</span><span>●</span><span>●</span></div></div>';
        const u = m.from === 'user';
        const safe = String(m.text).replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br/>');
        return '<div class="flex ' + (u ? 'justify-end' : 'justify-start') + '"><div class="' + (u ? 'bg-blue-600 text-white' : 'bg-white border') + ' rounded-2xl px-4 py-3 text-sm max-w-[85%] leading-relaxed">' + safe + '</div></div>';
      }).join('');
      el.scrollTop = el.scrollHeight;
    }

    function send() {
      if (busy) return;
      const inp = document.getElementById('inp');
      const t = inp.value.trim();
      if (!t) return;
      msgs.push({ from: 'user', text: t });
      inp.value = '';
      msgs.push({ typing: true });
      busy = true;
      render();
      setTimeout(() => {
        msgs = msgs.filter(m => !m.typing);
        msgs.push({ from: 'yar', text: replyFor(t) });
        busy = false;
        render();
      }, 600 + Math.random() * 500);
    }

    function quick(t) { document.getElementById('inp').value = t; send(); }
    function resetChat() {
      msgs = [{ from: 'yar', text: 'گفتگو پاک شد. دوباره شروع کنیم؟' }];
      render();
    }
    function go(tab) {
      ['chat','tasks','goals','profile'].forEach(t => {
        document.getElementById('screen-' + t).classList.toggle('active', t === tab);
        document.getElementById('tab-' + t).classList.toggle('tab-on', t === tab);
      });
    }
    render();
  </script>
</body>
</html>
