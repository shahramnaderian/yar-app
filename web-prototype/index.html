<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>یار — دستیار هوشمند شخصی</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: Vazirmatn, system-ui, sans-serif; }
    .phone { width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 25px 80px rgba(0,0,0,.5); }
    .screen { display: none; height: 100%; flex-direction: column; }
    .screen.active { display: flex; }
    .tab-active { color: #2563eb; }
    .typing span { animation: blink 1.2s infinite; opacity: 0.3; }
    .typing span:nth-child(2) { animation-delay: .2s; }
    .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 50% { opacity: 1; } }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center gap-4 p-4 bg-slate-900">
  <div class="phone bg-slate-50 flex flex-col">
    <div class="px-6 py-2 text-sm font-semibold flex justify-between"><span>۹:۴۱</span><span id="ai-badge" class="text-xs text-amber-600">در حال اتصال...</span></div>
    <div class="flex-1 overflow-hidden relative">
      <div id="screen-chat" class="screen active">
        <div class="px-4 py-3 border-b bg-white flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">ی</div>
          <div class="flex-1">
            <div class="font-semibold">یار</div>
            <div id="status-line" class="text-xs text-green-600">آنلاین</div>
          </div>
          <button onclick="resetChat()" class="text-xs text-slate-400 hover:text-slate-600">پاک کردن</button>
        </div>
        <div id="msgs" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50"></div>
        <div class="px-3 pt-2 flex gap-2 overflow-x-auto">
          <button onclick="quick('قبض برق رو چک کن')" class="shrink-0 text-xs bg-white border rounded-full px-3 py-1">قبض برق</button>
          <button onclick="quick('برای سفر شیراز ایده بده')" class="shrink-0 text-xs bg-white border rounded-full px-3 py-1">سفر</button>
          <button onclick="quick('یک برنامه روزانه پیشنهاد بده')" class="shrink-0 text-xs bg-white border rounded-full px-3 py-1">برنامه روزانه</button>
        </div>
        <div class="p-3 bg-white border-t flex gap-2">
          <input id="inp" class="flex-1 bg-slate-100 rounded-full px-4 py-3 text-sm outline-none" placeholder="پیامت رو بنویس..." onkeydown="if(event.key==='Enter')send()" />
          <button id="send-btn" onclick="send()" class="w-11 h-11 rounded-full bg-blue-600 text-white">➤</button>
        </div>
      </div>
      <div id="screen-tasks" class="screen">
        <div class="px-4 py-4 bg-white border-b font-bold text-xl">وظایف</div>
        <div class="p-4 space-y-3">
          <div class="bg-white rounded-2xl p-4 shadow-sm border">قبض برق — منتظر تأیید</div>
          <div class="bg-white rounded-2xl p-4 shadow-sm border">خلاصه گزارش — در حال پردازش</div>
        </div>
      </div>
      <div id="screen-goals" class="screen">
        <div class="px-4 py-4 bg-white border-b font-bold text-xl">اهداف</div>
        <div class="p-4 space-y-3">
          <div class="bg-white rounded-2xl p-4 border">یادگیری Flutter — ۳۵٪</div>
          <div class="bg-white rounded-2xl p-4 border">ورزش منظم — ۶۰٪</div>
        </div>
      </div>
      <div id="screen-profile" class="screen">
        <div class="px-4 py-4 bg-white border-b font-bold text-xl">پروفایل</div>
        <div class="p-6 text-center">
          <div class="w-20 h-20 rounded-full bg-blue-600 text-white text-3xl font-bold flex items-center justify-center mx-auto">ک</div>
          <div class="mt-3 text-xl font-bold">کاربر نمونه</div>
          <div id="profile-ai" class="text-sm text-slate-500 mt-1">وضعیت AI: در حال بررسی</div>
        </div>
      </div>
    </div>
    <div class="bg-white border-t flex justify-around py-2 pb-6 text-slate-400 text-xs">
      <button onclick="go('chat')" id="tab-chat" class="tab-active flex flex-col items-center gap-1"><span>💬</span><span>چت</span></button>
      <button onclick="go('tasks')" id="tab-tasks" class="flex flex-col items-center gap-1"><span>✓</span><span>وظایف</span></button>
      <button onclick="go('goals')" id="tab-goals" class="flex flex-col items-center gap-1"><span>🏁</span><span>اهداف</span></button>
      <button onclick="go('profile')" id="tab-profile" class="flex flex-col items-center gap-1"><span>👤</span><span>پروفایل</span></button>
    </div>
  </div>
  <p class="text-slate-400 text-xs text-center max-w-sm">API پیش‌فرض: <code class="text-slate-300">http://localhost:3000</code> — بک‌اند را با کلید AI اجرا کنید</p>

  <script>
    const API_BASE = localStorage.getItem('yar_api') || 'http://localhost:3000';
    const SESSION = localStorage.getItem('yar_session') || ('s_' + Math.random().toString(36).slice(2, 10));
    localStorage.setItem('yar_session', SESSION);

    let msgs = [{ from: 'yar', text: 'سلام! من یار هستم. چطور می‌تونم امروز کمکت کنم؟' }];
    let busy = false;
    let aiReady = false;

    async function checkHealth() {
      try {
        const r = await fetch(API_BASE + '/api/health');
        const d = await r.json();
        aiReady = !!(d.ai && d.ai.configured);
        document.getElementById('ai-badge').textContent = aiReady ? 'AI فعال' : 'حالت آزمایشی';
        document.getElementById('ai-badge').className = 'text-xs ' + (aiReady ? 'text-green-600' : 'text-amber-600');
        document.getElementById('status-line').textContent = aiReady ? 'AI آنلاین' : 'mock / آزمایشی';
        document.getElementById('profile-ai').textContent = aiReady
          ? 'AI واقعی فعال (' + (d.ai.model || '') + ')'
          : 'کلید API تنظیم نشده — حالت mock';
      } catch (e) {
        document.getElementById('ai-badge').textContent = 'بک‌اند خاموش';
        document.getElementById('ai-badge').className = 'text-xs text-red-500';
        document.getElementById('status-line').textContent = 'آفلاین (پاسخ محلی)';
        document.getElementById('profile-ai').textContent = 'بک‌اند در دسترس نیست';
      }
    }

    function render() {
      const el = document.getElementById('msgs');
      el.innerHTML = msgs.map(m => {
        if (m.typing) {
          return `<div class="flex justify-start"><div class="bg-white border rounded-2xl px-4 py-3 text-sm typing"><span>●</span><span>●</span><span>●</span></div></div>`;
        }
        const u = m.from === 'user';
        const safe = String(m.text).replace(/</g, '&lt;').replace(/>/g, '&gt;');
        return `<div class="flex ${u ? 'justify-end' : 'justify-start'}"><div class="${u ? 'bg-blue-600 text-white' : 'bg-white border'} rounded-2xl px-4 py-3 text-sm max-w-[78%] whitespace-pre-wrap">${safe}</div></div>`;
      }).join('');
      el.scrollTop = el.scrollHeight;
    }

    function localFallback(t) {
      if (t.includes('قبض') || t.includes('برق')) return 'قبض برق حدود ۲۸۰ هزار تومانه. (پاسخ محلی — بک‌اند وصل نیست)';
      if (t.includes('سفر') || t.includes('بلیط')) return 'برای کجا و چه تاریخی؟ (پاسخ محلی)';
      return 'بک‌اند در دسترس نیست. لطفاً سرور را روی پورت ۳۰۰۰ اجرا کن.';
    }

    async function send() {
      if (busy) return;
      const inp = document.getElementById('inp');
      const t = inp.value.trim();
      if (!t) return;
      msgs.push({ from: 'user', text: t });
      inp.value = '';
      msgs.push({ typing: true });
      busy = true;
      document.getElementById('send-btn').disabled = true;
      render();

      try {
        const r = await fetch(API_BASE + '/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: t, sessionId: SESSION })
        });
        const d = await r.json();
        msgs = msgs.filter(m => !m.typing);
        if (!r.ok) throw new Error(d.error || 'error');
        msgs.push({ from: 'yar', text: d.reply || 'پاسخی دریافت نشد.' });
      } catch (e) {
        msgs = msgs.filter(m => !m.typing);
        msgs.push({ from: 'yar', text: localFallback(t) });
      }

      busy = false;
      document.getElementById('send-btn').disabled = false;
      render();
    }

    function quick(t) {
      document.getElementById('inp').value = t;
      send();
    }

    async function resetChat() {
      try {
        await fetch(API_BASE + '/api/chat/reset', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: SESSION })
        });
      } catch (_) {}
      msgs = [{ from: 'yar', text: 'گفتگو پاک شد. دوباره شروع کنیم؟' }];
      render();
    }

    function go(tab) {
      ['chat', 'tasks', 'goals', 'profile'].forEach(t => {
        document.getElementById('screen-' + t).classList.remove('active');
        document.getElementById('tab-' + t).classList.remove('tab-active');
      });
      document.getElementById('screen-' + tab).classList.add('active');
      document.getElementById('tab-' + tab).classList.add('tab-active');
    }

    render();
    checkHealth();
  </script>
</body>
</html>
