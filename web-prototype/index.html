<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>یار — دستیار هوشمند شخصی</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet" />
  <style>
    * { font-family: Vazirmatn, system-ui, sans-serif; }
    .phone { width: 390px; height: 844px; border-radius: 40px; overflow: hidden; box-shadow: 0 25px 80px rgba(0,0,0,.5); }
    .screen { display: none; height: 100%; flex-direction: column; }
    .screen.active { display: flex; }
    .tab-active { color: #2563eb; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 bg-slate-900">
  <div class="phone bg-slate-50 flex flex-col">
    <div class="px-6 py-2 text-sm font-semibold flex justify-between"><span>۹:۴۱</span><span>●●●</span></div>
    <div class="flex-1 overflow-hidden relative">
      <div id="screen-chat" class="screen active">
        <div class="px-4 py-3 border-b bg-white flex items-center gap-3">
          <div class="w-10 h-10 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">ی</div>
          <div><div class="font-semibold">یار</div><div class="text-xs text-green-600">آنلاین</div></div>
        </div>
        <div id="msgs" class="flex-1 overflow-y-auto p-4 space-y-3 bg-slate-50"></div>
        <div class="p-3 bg-white border-t flex gap-2">
          <input id="inp" class="flex-1 bg-slate-100 rounded-full px-4 py-3 text-sm outline-none" placeholder="پیامت رو بنویس..." onkeydown="if(event.key==='Enter')send()" />
          <button onclick="send()" class="w-11 h-11 rounded-full bg-blue-600 text-white">➤</button>
        </div>
      </div>
      <div id="screen-tasks" class="screen">
        <div class="px-4 py-4 bg-white border-b font-bold text-xl">وظایف</div>
        <div class="p-4 space-y-3">
          <div class="bg-white rounded-2xl p-4 shadow-sm border">قبض برق — منتظر تأیید</div>
          <div class="bg-white rounded-2xl p-4 shadow-sm border">خلاصه گزارش — در حال پردازش</div>
        </div>
      </div>
      <div id="screen-goals" class="screen">
        <div class="px-4 py-4 bg-white border-b font-bold text-xl">اهداف</div>
        <div class="p-4 space-y-3">
          <div class="bg-white rounded-2xl p-4 border">یادگیری Flutter — ۳۵٪</div>
          <div class="bg-white rounded-2xl p-4 border">ورزش منظم — ۶۰٪</div>
        </div>
      </div>
      <div id="screen-profile" class="screen">
        <div class="px-4 py-4 bg-white border-b font-bold text-xl">پروفایل</div>
        <div class="p-6 text-center">
          <div class="w-20 h-20 rounded-full bg-blue-600 text-white text-3xl font-bold flex items-center justify-center mx-auto">ک</div>
          <div class="mt-3 text-xl font-bold">کاربر نمونه</div>
          <div class="text-sm text-slate-500">پلن رایگان</div>
        </div>
      </div>
    </div>
    <div class="bg-white border-t flex justify-around py-2 pb-6 text-slate-400 text-xs">
      <button onclick="go('chat')" id="tab-chat" class="tab-active flex flex-col items-center gap-1"><span>💬</span><span>چت</span></button>
      <button onclick="go('tasks')" id="tab-tasks" class="flex flex-col items-center gap-1"><span>✓</span><span>وظایف</span></button>
      <button onclick="go('goals')" id="tab-goals" class="flex flex-col items-center gap-1"><span>🏁</span><span>اهداف</span></button>
      <button onclick="go('profile')" id="tab-profile" class="flex flex-col items-center gap-1"><span>👤</span><span>پروفایل</span></button>
    </div>
  </div>
  <script>
    const msgs = [{from:'yar', text:'سلام! من یار هستم. چطور می‌تونم کمکت کنم؟'}];
    function render() {
      const el = document.getElementById('msgs');
      el.innerHTML = msgs.map(m => {
        const u = m.from==='user';
        return `<div class="flex ${u?'justify-end':'justify-start'}"><div class="${u?'bg-blue-600 text-white':'bg-white border'} rounded-2xl px-4 py-3 text-sm max-w-[78%]">${m.text}</div></div>`;
      }).join('');
      el.scrollTop = el.scrollHeight;
    }
    function send() {
      const inp = document.getElementById('inp');
      const t = inp.value.trim(); if(!t) return;
      msgs.push({from:'user', text:t}); inp.value=''; render();
      setTimeout(() => {
        let r = 'متوجه شدم. جزئیات بیشتری بگو.';
        if (t.includes('قبض')||t.includes('برق')) r = 'قبض برق حدود ۲۸۰ هزار تومانه. می‌خوای پرداختش کنم؟';
        if (t.includes('سفر')||t.includes('بلیط')) r = 'برای کجا و چه تاریخی؟';
        msgs.push({from:'yar', text:r}); render();
      }, 700);
    }
    function go(tab) {
      ['chat','tasks','goals','profile'].forEach(t => {
        document.getElementById('screen-'+t).classList.remove('active');
        document.getElementById('tab-'+t).classList.remove('tab-active');
      });
      document.getElementById('screen-'+tab).classList.add('active');
      document.getElementById('tab-'+tab).classList.add('tab-active');
    }
    render();
  </script>
</body>
</html>
