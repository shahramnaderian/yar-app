name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "flutter-skeleton/**"
      - ".github/workflows/build-android.yml"

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test backend
        run: |
          cd backend
          npm install
          npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Flutter project
        run: |
          cd flutter-skeleton
          flutter create . --project-name yar --org com.yar.app --platforms=android
          git checkout -- lib pubspec.yaml
          flutter pub get
          flutter analyze

      - name: Build release APK
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          cd flutter-skeleton
          if [ -n "$API_BASE" ]; then
            flutter build apk --release --dart-define=API_BASE="$API_BASE"
          else
            flutter build apk --release
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: yar-release-apk
          path: flutter-skeleton/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
